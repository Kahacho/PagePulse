<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ops Dashboard - Warehouse</title>
		<style>
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
					Arial, sans-serif;
				background-color: #f0f4f8;
				margin: 0;
				display: flex;
				justify-content: center;
				align-items: flex-start;
				min-height: 100vh;
				padding: 60px 20px;
				box-sizing: border-box;
			}
			.dashboard {
				width: 100%;
				max-width: 460px;
			}
			/* Real page-to-page navigation, each link is a distinct pathname,
			   which is what PagePulse actually keys its per-page memory on. */
			.tab-nav {
				display: flex;
				gap: 6px;
				margin-bottom: 14px;
				background-color: #e2e8f0;
				border-radius: 10px;
				padding: 4px;
			}
			.tab-nav a {
				flex: 1;
				text-align: center;
				padding: 8px 0;
				border-radius: 7px;
				font-size: 0.8rem;
				font-weight: 600;
				text-decoration: none;
				color: #627d98;
			}
			.tab-nav a.current {
				background-color: #ffffff;
				color: #1d3557;
				box-shadow: 0 1px 3px rgba(29, 53, 87, 0.15);
			}
			.card {
				background-color: #ffffff;
				border-radius: 16px;
				padding: 32px;
				box-shadow: 0 10px 25px rgba(29, 53, 87, 0.1);
				border: 1px solid #e1e8ed;
				box-sizing: border-box;
			}
			.card h1 {
				font-size: 1.4rem;
				color: #1d3557;
				margin: 0 0 4px 0;
				font-weight: 700;
			}
			.card .subtitle {
				color: #627d98;
				margin: 0 0 24px 0;
				font-size: 0.9rem;
			}
			.crate-row {
				display: flex;
				align-items: center;
				gap: 14px;
				background-color: #f7fafc;
				border-radius: 10px;
				padding: 16px;
				margin-bottom: 16px;
				transition: all 0.4s ease;
				border: 1px solid transparent;
			}
			.crate-icon {
				font-size: 1.8rem;
				line-height: 1;
				transition: transform 0.3s ease;
			}
			.crate-info .sku {
				font-size: 0.75rem;
				color: #a0aec0;
				font-weight: 600;
				text-transform: uppercase;
				transition: color 0.4s ease;
			}
			.crate-info .name {
				font-size: 0.95rem;
				color: #2d3748;
				font-weight: 600;
				transition: color 0.4s ease;
			}

			.crate-row.state-ready {
				background-color: #f0fdf4;
				border-color: #bbf7d0;
			}
			.crate-row.state-ready .crate-icon {
				transform: scale(1.1);
			}
			.crate-row.state-ready .crate-info .sku {
				color: #81c784;
			}
			.crate-row.state-ready .crate-info .name {
				color: #1e293b;
			}

			.status-summary {
				background-color: #f7fafc;
				border-radius: 8px;
				padding: 12px 16px;
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-size: 0.9rem;
				color: #4a5568;
			}
			.status-badge {
				font-weight: 700;
				font-size: 0.8rem;
				padding: 4px 12px;
				border-radius: 6px;
				text-transform: uppercase;
			}
			.badge-processing {
				color: #b7791f;
				background-color: #fefcbf;
			}
			.badge-ready {
				color: #22543d;
				background-color: #c6f6d5;
			}
		</style>
	</head>
	<body>
		<div class="dashboard">
			<nav class="tab-nav">
				<a href="warehouse-status.html" class="current">Warehouse</a>
				<a href="shipping-status.html">Shipping</a>
				<a href="support-queue.html">Support</a>
			</nav>

			<div class="card">
				<h1>Warehouse Status</h1>
				<p class="subtitle">Order #WH-48213</p>
				<div class="crate-row" id="crateRow">
					<div class="crate-icon" id="crateIcon">📦</div>
					<div class="crate-info">
						<div class="sku">SKU-2291</div>
						<div class="name">Mechanical Keyboard, Silver</div>
					</div>
				</div>

				<div class="status-summary">
					<span>Current Status:</span>
					<span class="status-badge" id="statusBadge">Processing</span>
				</div>
			</div>
		</div>
		<script>
			const RESET_AFTER = 60 * 1000; // 1 minute
			let refreshCount = Number(
				localStorage.getItem('warehouseRefreshCount') || 0,
			);
			let startedAt = Number(localStorage.getItem('warehouseStartedAt') || 0);

			if (!startedAt || Date.now() - startedAt >= RESET_AFTER) {
				refreshCount = 0;
				startedAt = Date.now();
				localStorage.setItem('warehouseRefreshCount', 0);
				localStorage.setItem('warehouseStartedAt', startedAt);
			}

			refreshCount++;
			localStorage.setItem('warehouseRefreshCount', refreshCount);

			const crateRow = document.getElementById('crateRow');
			const crateIcon = document.getElementById('crateIcon');
			const statusBadge = document.getElementById('statusBadge');

			if (refreshCount >= 4) {
				crateRow.className = 'crate-row state-ready';
				crateIcon.textContent = '🚚'; // Morph the stagnant box into an active delivery truck
				statusBadge.textContent = 'Ready to Ship';
				statusBadge.className = 'status-badge badge-ready';
			} else {
				crateRow.className = 'crate-row';
				crateIcon.textContent = '📦';
				statusBadge.textContent = 'Processing';
				statusBadge.className = 'status-badge badge-processing';
			}
		</script>
	</body>
</html>
